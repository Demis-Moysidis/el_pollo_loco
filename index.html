<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="shortcut icon" href="./img/6_salsa_bottle/bottle_rotation/1_bottle_rotation.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">

    <script src="./js/helper-functions.js"></script>
    <script src="./js/sounds.js"></script>

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/collidable-object.class.js"></script>
    <script src="./models/collectable-object.class.js"></script>
    <script src="./models/collectable-bottle.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken-normal.class.js"></script>
    <script src="./models/chicken-small.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>

    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>

    <script src="./js/game.js"></script>
</head>
<body onload="init()">
    <h1>El Pollo Loco</h1>

    <div id="canvas_div" class="canvas_div">
        <canvas id="canvas" width="720" height="480"></canvas>

        <div id="start_game_btn" class="start_game_btn">
            <button onclick="startGame()" >
                Play
                <img src="icons/play_arrow.svg" alt="">
            </button>
        </div>

        <div id="cancel_game_btn" class="cancel_game_btn d_none">
            <button onclick="cancelGame()">
                <img class="gameplay_btn" src="icons/cancel.svg" alt="">
            </button>
        </div>

        <div id="music_btn" class="music_btn">
            <button onclick="musicToggle()">
                <img id="music_note" class="gameplay_btn d_none" src="icons/music_note.svg" alt="">
                <img id="music_off" class="gameplay_btn" src="icons/music_off.svg" alt="">
            </button>
        </div>

        <div id="pause_btn" class="pause_btn d_none">
            <button onclick="pauseGame()">
                <img id="pause_game" class="gameplay_btn" src="icons/pause_circle.svg" alt="">
                <img id="run_game" class="gameplay_btn d_none" src="icons/play_circle.svg" alt="">
            </button>
        </div>

        <div id="info_game_btn" class="info_game_btn">
            <button onclick="infoGame()">
                <img class="gameplay_btn" src="icons/info_i.svg" alt="">
            </button>
        </div>

        <div id="play_again_btn" class="start_game_btn play_again_top d_none">
            <button onclick="playAgain()">
                Play Again
                <img src="icons/play_arrow.svg" alt="">
            </button>
        </div>

        <div id="fullscreen_btn" class="fullscreen_btn">
            <button onclick="fullscreenToggle()">
                <img id="fullscreen_on" class="gameplay_btn" src="icons/fullscreen.svg" alt="">
                <img id="fullscreen_off" class="gameplay_btn d_none" src="icons/fullscreen_exit.svg" alt="">
            </button>
        </div>

        <div id="info_game_description" class="info_game_description d_none">
            <div class="info_game_position_relativ">
                <button onclick="infoGame()" class="info_game_description_close">
                    <img src="icons/close.svg" alt="">
                </button>
                <h3>Game Rules</h3>
                <p>Defeat enemies by jumping on them or throwing collected bottles.
                You win the game by defeating the Endboss, but if you run out of 
                bottles before the boss is defeated, you lose! 
                </p>
                <h3>Controls</h3>
                <div class="info_game_controls">
                    <p>
                        Left:
                        <img src="icons/arrow_left.svg" alt="">
                    </p>
                    <p>
                        Right:
                        <img src="icons/arrow_right.svg" alt="">
                    </p>
                    <p class="info_game_controls_jump">
                        Jump:
                        <img src="icons/space_bar.svg" alt="">
                    </p>
                    <p>
                        Throw:
                        <span>D</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
